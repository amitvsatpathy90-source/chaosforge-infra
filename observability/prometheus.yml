# Merged scrape config for the shared AWS observability stack; job names kept identical to both
# repos' native configs so dashboards/alerts work unmodified.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# chaosforge's alerts.yml carries the C26/C27 acceptance-gate rules; rpe's dlt.rules.yml carries
# the ADR-23 DLT alerting and redis.rules.yml the ADR-27 Redis memory watermark (dropping either
# breaks LOCAL-PARITY). Routing to an Alertmanager stays a production add-on in BOTH projects
# (each one's own docs) — alerts reach FIRING here, nothing pages. Parity, not a regression.
# infra-scrape-absent.rules.yml is the one rule file this repo owns outright — it alerts on the
# AWS-only mTLS-cert-provisioning failure mode, which has no sibling-repo equivalent to copy.
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/rules/dlt.rules.yml
  - /etc/prometheus/rules/redis.rules.yml
  - /etc/prometheus/rules/infra-scrape-absent.rules.yml

scrape_configs:
  # ── chaosforge ──────────────────────────────────────────────────────────
  # Gateway is the sole non-mTLS chaosforge service (public ingress — mtls-rules.md): plain HTTP.
  - job_name: edge-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["edge-gateway.chaosforge.internal:9080"]

  # CP/Exec run the `mtls` Spring profile in AWS (client-auth: need at the TLS layer — a scrape
  # without a client cert is rejected at the handshake, before any HTTP). Prometheus presents its
  # own internal-CA client identity, generated by chaosforge's generate-certs.sh (the `prometheus`
  # PEM identity added in Module 6) and placed on the observability EFS volume at /mnt/mtls.
  # NOTE the local lab config scrapes these over plain HTTP — that's because bootRun without the
  # mtls profile is the local default, not a contradiction.
  - job_name: control-plane
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /mnt/mtls/ca-cert.pem
      cert_file: /mnt/mtls/prometheus-cert.pem
      key_file: /mnt/mtls/prometheus-key.pem
    static_configs:
      - targets: ["control-plane.chaosforge.internal:8081"]

  - job_name: execution-service
    metrics_path: /actuator/prometheus
    scheme: https
    tls_config:
      ca_file: /mnt/mtls/ca-cert.pem
      cert_file: /mnt/mtls/prometheus-cert.pem
      key_file: /mnt/mtls/prometheus-key.pem
    static_configs:
      - targets: ["execution-service.chaosforge.internal:8082"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── rpe ─────────────────────────────────────────────────────────────────
  # Requires a JWT with scope metrics:scrape (ADR-19). Token below is a placeholder — real token
  # is a swap, not a rewrite. See docs/adrs/ADR-0404.md.
  - job_name: rpe-detection
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape_token
    static_configs:
      - targets: ["detection.rpe.internal:8080"]

  - job_name: rpe-relay
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape_token
    static_configs:
      - targets: ["relay.rpe.internal:8082"]

  - job_name: rpe-alert
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape_token
    static_configs:
      - targets: ["alert.rpe.internal:8083"]

  - job_name: rpe-triage
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape_token
    static_configs:
      - targets: ["triage.rpe.internal:8081"]
